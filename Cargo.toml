[workspace]
resolver = "3"
members = [
    "packages/bridge", "packages/config-rs", "packages/core", "packages/device-rs",
    "packages/demucs_burn", "packages/time", "packages/voxcpm-burn", "packages/app/src-tauri",
    "packages/fs", "packages/sf-cli", "packages/subtitle-ocr-cli", "packages/server", "packages/tts",
    "packages/sdk", "packages/cli", "packages/env", "packages/subtitle-asr", "packages/llm", "packages/pacer-rs", "packages/voxlab",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# 本地 workspace crate
bridge = { path = "packages/bridge" }
config-rs = { path = "packages/config-rs" }
device-rs = { path = "packages/device-rs" }
fs = { path = "packages/fs" }
ld-core = { path = "packages/core" }
llm = { path = "packages/llm" }
pacer-rs = { path = "packages/pacer-rs" }
server = { path = "packages/server" }
time = { path = "packages/time" }
voxlab = { path = "packages/voxlab" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = { version = "0.0.13", features = ["serde"] }
specta-serde = { version = "0.0.13" }
specta-util = { version = "0.0.13" }
specta-jsonschema = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
fnrpc = { version = "0.4.2", features = ["ts-bindings", "tracing"] }
fnrpc-axum = { version = "0.4.2" }
fnrpc-tauri = { version = "0.4.2" }
notify = { version = "6", features = ["macos_fsevent"] }
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
# 进度条（UX 层反馈，独立于 tracing 诊断日志）。
indicatif = "0.17"
# 原生 DNS-SD/mDNS 发现（Linux 走 avahi D-Bus，macOS/Windows 走系统 API）。
# 相比 mdns-sd 的自实现广播，这里用 OS 原生栈，与 zeroconf/bonjour 互通。
mdns-sd-discovery = "0.3"
image = "0.25"
ndarray = "0.17"
# ocr-segment-adjust 用 ffmpeg 读视频像素高度（Y 偏移惩罚归一化分母），版本对齐 ocr-lab。
# non-exhaustive-enums：ffmpeg-sys-next 绑定 master-latest(≈4.12) 头文件含新增枚举
# （如 AV_CODEC_ID_PCM_DVDA/ITUT_T35），需开启后让 ffmpeg-next 的 match 走通配分支。
ffmpeg-next = { version = "9.0.0", features = ["non-exhaustive-enums"] }
voxcpm-rs = { version = "0.5.0", default-features = false }
# OCR 核心（从本仓库拆出的 ocr-lab）。vendor 本地副本（修复 opencv 0.100 绑定
# 不再生成 AlgorithmHint 重载导致 warp_perspective 参数不匹配），改动：
#   packages/rapidocr-ort/src/pipeline.rs 去掉 ALGO_HINT_ACCURATE 参数。
subtitle-finder = { path = "../vendor/ocr-lab/packages/subtitle-finder" }
subtitle-ocr = { path = "../vendor/ocr-lab/packages/subtitle-ocr" }
rapidocr-ort = { path = "../vendor/ocr-lab/packages/rapidocr-ort" }

[profile.release]
lto = "fat"
codegen-units = 1

[patch.crates-io]
# ffmpeg-sys-next 默认强制 bindgen "runtime" feature，导致 clang-sys 进入 runtime 模式，
# 与 opencv 绑定生成器的静态链接冲突（"libclang not loaded on this thread"）。
# vendor 后去掉 runtime，改用静态链接 libclang.lib（LLVM 官方预编译包提供）。
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }
voxcpm-rs = { path = "submodule/voxcpm-rs" }
burn-cubecl = { path = "submodule/voxcpm-rs/vendor/patched/burn-cubecl" }
cubecl-spirv = { path = "submodule/voxcpm-rs/vendor/patched/cubecl-spirv" }
# Specta rc.26 crates are not yet published to crates.io; track the exact
# commit tauri-specta uses so we stay in sync with upstream behaviour
# (including serde variant/field renames via `specta-serde::PhasesFormat`).
# TODO: Remove once the rc.26 Specta crates are published.
specta = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-util = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
fnrpc = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "76ddfbfba4d65feff5d911968133987107901151" }
fnrpc-axum = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "76ddfbfba4d65feff5d911968133987107901151" }
fnrpc-tauri = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "76ddfbfba4d65feff5d911968133987107901151" }
