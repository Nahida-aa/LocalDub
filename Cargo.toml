[workspace]
members = [
    "packages/benchmark/ocr/oar-rs", "packages/bridge", "packages/config-rs", "packages/core-rs", "packages/device-rs",
    "packages/separate/demucs_burn", "packages/subtitle-rust", "packages/time", "packages/voxcpm-burn", "packages/app/src-tauri",
    "packages/fs", "packages/sf-ocr"
]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = { version = "0.0.13", features = ["serde"] }
specta-serde = { version = "0.0.13" }
specta-util = { version = "0.0.13" }
fnrpc = { version = "0.4.2", features = ["ts-bindings", "tracing"] }
fnrpc-axum = { version = "0.4.2" }
fnrpc-tauri = { version = "0.4.2" }
notify = { version = "6", features = ["macos_fsevent"] }
async-channel = "2"
tracing = "0.1"
# OCR 核心（从本仓库拆出的 ocr-lab）。git 源由 cargo 自动拉取/解析其内部
# workspace 依赖与 [patch]，LocalDub 侧零镜像；版本以 ocr-lab 为准。
subtitle-finder = { git = "https://github.com/Nahida-aa/ocr-lab.git", rev = "202310f" }
subtitle-ocr = { git = "https://github.com/Nahida-aa/ocr-lab.git", rev = "202310f" }
rapidocr-ort = { git = "https://github.com/Nahida-aa/ocr-lab.git", rev = "202310f" }

[profile.release]
lto = "fat"
codegen-units = 1

[patch.crates-io]
burn-cubecl = { path = "submodule/voxcpm-rs/vendor/patched/burn-cubecl" }
cubecl-spirv = { path = "submodule/voxcpm-rs/vendor/patched/cubecl-spirv" }
# Specta rc.26 crates are not yet published to crates.io; track the exact
# commit tauri-specta uses so we stay in sync with upstream behaviour
# (including serde variant/field renames via `specta-serde::PhasesFormat`).
# TODO: Remove once the rc.26 Specta crates are published.
specta = { git = "https://github.com/specta-rs/specta.git", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
specta-util = { git = "https://github.com/specta-rs/specta.git", rev = "3c535739ea7bd8737ecdbff6c3aef9b7330da706" }
fnrpc = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "b77f290320ec88fc382c6a5130de1cf2f18af2f9" }
fnrpc-axum = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "b77f290320ec88fc382c6a5130de1cf2f18af2f9" }
fnrpc-tauri = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "b77f290320ec88fc382c6a5130de1cf2f18af2f9" }
