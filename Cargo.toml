[workspace]
resolver = "3"
members = [
    "packages/bridge", "packages/config-rs", "packages/core", "packages/device-rs",
    "packages/time", "packages/app/src-tauri",
    "packages/fs", "packages/server",
    "packages/sdk", "packages/cli", "packages/llm", "packages/pacer-rs",
    "packages/paths",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# 本地 workspace crate
bridge = { path = "packages/bridge" }
config-rs = { path = "packages/config-rs" }
device-rs = { path = "packages/device-rs" }
fs = { path = "packages/fs" }
ld-core = { path = "packages/core" }
llm = { path = "packages/llm" }
pacer-rs = { path = "packages/pacer-rs" }
paths = { path = "packages/paths" }
server = { path = "packages/server" }
time = { path = "packages/time" }
voxcpm-cloud = { git = "https://github.com/Nahida-aa/vox-lab", tag = "v0.1.2" }
# aa-workflow 耐久执行引擎（独立 repo，TanStack Workflow core engine 层的 Rust 对刻，
# 内核「代码即 DAG」）。当前实验性引入：integration/workflow 整体暂停编译，
# 依赖为恢复预留。rev 收敛在此处单处维护，packages/core 只 `.workspace = true` 引用。
# 注意：aa-workflow 无语义化 tag，升降级用 `git ls-remote` 拿新 rev 后手动改这里。
aa_workflow_core = { git = "https://github.com/Nahida-aa/aa_workflow.git", rev = "7009984c1f93758d18458e58509e2758ff0a9edc" }
# vision-lab 09dc6ac 起包名/文件夹名/bin 名统一 `-` → `_`（subtitle_ocr /
# subtitle_ocr_post / subtitle_finder / rapidocr_ort / ocr_types ...）。
ocr_types = { git = "https://github.com/Nahida-aa/vision-lab", rev = "09dc6ac", features = ["specta-types"] }
subtitle_ocr_post = { git = "https://github.com/Nahida-aa/vision-lab", rev = "09dc6ac", features = ["specta-types"] }
# subtitle-ocr-types 承载除 OcrBoxResult 外的字幕 OCR 产物/管线类型（FrameResult /
# OcrSegment / OcrFramesResult / compute_box_* / edit_distance 等）；subtitle 承载
# 纯字幕领域 SubtitleSegment。自 vision-lab 拆分后，LocalDub 直接依赖这两个 crate。
subtitle_ocr_types = { git = "https://github.com/Nahida-aa/vision-lab", rev = "09dc6ac", features = ["specta-types"] }
subtitle = { git = "https://github.com/Nahida-aa/vision-lab", rev = "09dc6ac", features = ["specta-types"] }
regex = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = { version = "0.0.13", features = ["serde"] }
specta-serde = { version = "0.0.13" }
specta-util = { version = "0.0.13" }
specta-jsonschema = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
fnrpc = { version = "0.4.2", features = ["ts-bindings", "tracing"] }
fnrpc-axum = { version = "0.4.2" }
fnrpc-tauri = { version = "0.4.2" }
notify = { version = "6", features = ["macos_fsevent"] }
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
# 进度条（UX 层反馈，独立于 tracing 诊断日志）。
indicatif = "0.17"
derive_more = { version = "1", features = ["full"] }
# 原生 DNS-SD/mDNS 发现（Linux 走 avahi D-Bus，macOS/Windows 走系统 API）。
# 相比 mdns-sd 的自实现广播，这里用 OS 原生栈，与 zeroconf/bonjour 互通。
mdns-sd-discovery = "0.3"
image = "0.25"
ndarray = "0.17"
# ocr-segment-adjust 用 ffmpeg 读视频像素高度（Y 偏移惩罚归一化分母），版本对齐 vision-lab。
ffmpeg-next = "9.0.0"
voxcpm-rs = { version = "0.5.0", default-features = false }
# 哈希与编码（用于二进制校验下载完整性）。
sha2 = "0.10"
hex = "0.4"
# 设备信息采集 (deviceInfo 命令): CPU/内存/OS 跨平台检测, mirror TS os.cpus()/os.totalmem()。
sysinfo = "0.30"
# Windows 资产为 zip（exe+dll 平铺），需解压后才能运行。
zip = { version = "0.6", default-features = false, features = ["deflate"] }
# 枚举派生（Display/EnumString/EnumIter/EnumVariantNames）：StepName / SubtitleSource
# / OutputMode 的 as_str / 解析 / 全量名单从派生生成，不再手写 match。
strum = { version = "0.27", features = ["derive"] }

# ffmpeg 探测视频高度/帧率（ocr-post 由 vision-lab release 二进制提供）。

[profile.release]
lto = "fat"
codegen-units = 1

[patch.crates-io]
# Specta rc.26 crates are not yet published to crates.io; track the exact
# commit tauri-specta uses so we stay in sync with upstream behaviour
# (including serde variant/field renames via `specta-serde::PhasesFormat`).
# TODO: Remove once the rc.26 Specta crates are published.
specta = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-macros = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-serde = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-typescript = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
specta-util = { git = "https://github.com/specta-rs/specta.git", rev = "7bfd7428d675201f2beec8a0f0221599a2b3ea45" }
fnrpc = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "c95425b038c9239abb0df5057c6c3faaca46a091" }
fnrpc-axum = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "c95425b038c9239abb0df5057c6c3faaca46a091" }
fnrpc-tauri = { git = "https://github.com/Nahida-aa/fnrpc.git", rev = "c95425b038c9239abb0df5057c6c3faaca46a091" }
