[package]
name = "app"
version = "0.1.0"
description = "LocalDub Desktop Application"
authors = ["Nahida-aa"]
edition = "2021"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fnrpc.workspace = true
fnrpc-tauri.workspace = true
server = { path = "../../server" }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }