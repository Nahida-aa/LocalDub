[package]
name = "ld-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
specta.workspace = true
clap.workspace = true
serde_json.workspace = true
chrono.workspace = true
config-rs.workspace = true
llm.workspace = true
mdns-sd.workspace = true
specta-typescript.workspace = true
specta-serde.workspace = true
specta-jsonschema.workspace = true
time.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry", "env-filter"] }
ffmpeg-next.workspace = true
regex.workspace = true
voxcpm-cloud.workspace = true
# 字幕 OCR 产物/管线类型（FrameResult/OcrSegment/OcrFramesResult/工具函数）来自
# subtitle-ocr-types；SubtitleSegment 的权威定义只在 subtitle；OCR 后处理算法来自
# subtitle_ocr_post。ocr_types 仅保留 OcrBoxResult，本包当前未直接使用，故不再依赖。
# git rev / tag 统一收敛在根 workspace.dependencies 单处维护，这里只引用。
subtitle_ocr_types.workspace = true
subtitle.workspace = true
subtitle_ocr_post.workspace = true
aa_pacer.workspace = true
reqwest.workspace = true
indicatif.workspace = true
derive_more.workspace = true
sha2.workspace = true
hex.workspace = true
zip.workspace = true
mdns-sd-discovery.workspace = true
strum.workspace = true
# mdns-sd-discovery (avahi D-Bus) 需要 tokio runtime 跑 browse
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
# aa-workflow 引擎（git 源，rev 收敛在根 workspace.dependencies）。当前
# integration/workflow 整体暂停编译，此依赖为恢复时预留。
aa_workflow_core.workspace = true
aa_workflow_middlewares.workspace = true
# FsRunStore 实现 async RunStore trait（trait object 需 async_trait box）
async-trait = "0.1"
# 流式消费 RunEventStream（futures_core::Stream）需要 StreamExt::next
futures = { version = "0.3", default-features = false, features = ["async-await"] }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
# FsRunStore 的 async 测试需要 #[tokio::test]（主依赖 tokio 关了 macros）
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
