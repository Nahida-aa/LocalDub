[package]
name = "ld-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
specta.workspace = true
clap.workspace = true
serde_json.workspace = true
chrono.workspace = true
config-rs.workspace = true
llm.workspace = true
mdns-sd.workspace = true
specta-typescript.workspace = true
specta-serde.workspace = true
specta-jsonschema.workspace = true
time.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry", "env-filter"] }
ffmpeg-next.workspace = true
regex.workspace = true
voxcpm-cloud.workspace = true
# 字幕 OCR 产物/管线类型（FrameResult/OcrSegment/OcrFramesResult/工具函数）来自
# subtitle-ocr-types；SubtitleSegment 的权威定义只在 subtitle；OCR 后处理算法来自
# subtitle_ocr_post。ocr_types 仅保留 OcrBoxResult，本包当前未直接使用，故不再依赖。
# git rev / tag 统一收敛在根 workspace.dependencies 单处维护，这里只引用。
subtitle_ocr_types.workspace = true
subtitle.workspace = true
subtitle_ocr_post.workspace = true
pacer-rs.workspace = true
reqwest.workspace = true
indicatif.workspace = true
derive_more.workspace = true
sha2.workspace = true
hex.workspace = true
zip.workspace = true
mdns-sd-discovery.workspace = true
strum.workspace = true
# mdns-sd-discovery (avahi D-Bus) 需要 tokio runtime 跑 browse
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
# aa-workflow 的 aa_workflow_core 引擎 (独立 repo, path dep)
aa_workflow_core = { path = "../../../../lib_ls/aa-workflow/packages/workflow_core" }

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
