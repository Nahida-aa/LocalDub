[package]
name = "demucs-burn"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "demucs-burn-wgpu"
path = "src/main.rs"
required-features = ["wgpu"]

[[bin]]
name = "demucs-burn-vulkan"
path = "src/main.rs"
required-features = ["vulkan"]

[[bin]]
name = "demucs-burn-cpu"
path = "src/main.rs"
required-features = ["cpu"]

[[bin]]
name = "demucs-burn-rocm"
path = "src/main.rs"
required-features = ["rocm"]

[[bin]]
name = "demucs-burn-tch"
path = "src/main.rs"
required-features = ["tch"]

[[bin]]
name = "demucs-burn-cuda"
path = "src/main.rs"
required-features = ["cuda"]

[features]
default = ["wgpu"]
wgpu = ["demucs-core/wgpu"]
vulkan = ["demucs-core/wgpu", "burn/vulkan"]
cpu = ["demucs-core/cpu"]
rocm = ["demucs-core/rocm"]
cuda = ["demucs-core/cuda"]
tch = ["demucs-core/tch"]
fusion = ["demucs-core/fusion"]
autotune = ["demucs-core/autotune"]

[dependencies]
config-rs.workspace = true
demucs-core = { path = "../../submodule/demucs-rs/demucs-core", default-features = false }
burn = { version = "0.20.1", default-features = false }
clap.workspace = true
hound = "3"
anyhow.workspace = true
pollster = "0.4"
