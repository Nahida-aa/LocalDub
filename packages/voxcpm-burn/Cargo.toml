[package]
name = "voxcpm-burn"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voxcpm-burn-wgpu"
path = "src/main.rs"
required-features = ["wgpu"]

[[bin]]
name = "voxcpm-burn-cpu"
path = "src/main.rs"
required-features = ["cpu"]

[[bin]]
name = "voxcpm-burn-vulkan"
path = "src/main.rs"
required-features = ["vulkan"]

[[bin]]
name = "voxcpm-burn-tch"
path = "src/main.rs"
required-features = ["tch"]

[features]
default = ["wgpu"]
wgpu = ["voxcpm-rs/wgpu"]
cpu = ["voxcpm-rs/cpu"]
vulkan = ["voxcpm-rs/vulkan"]
tch = ["burn/tch"]

[dependencies]
config-rs.workspace = true
voxcpm-rs.workspace = true
burn = { version = "0.20.1", default-features = false, features = ["std"] }
clap.workspace = true
hound = "3"
anyhow.workspace = true
pollster = "0.4"
env_logger = "0.11"
half = "2"
