pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: "**/*.rs"
      exclude:
        - "submodule/**"
      # 用全仓模式而非 `cargo fmt -- {staged_files}`:
      # rustfmt 文件模式下 use 排序与全仓模式不一致(小写/大写优先), 会导致每次提交循环改动
      run: cargo fmt --all
      stage_fixed: true

    - name: oxfmt
      glob: "**/*.{ts,tsx,js,jsx,json,jsonc}"
      exclude:
        - "submodule/**"
        - "packages/sdk/fnrpc/bindings.ts"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
